name: CI – Cypress + Newman + Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Install dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── TypeScript check ──────────────────────────────────────────────────────
      - name: TypeScript type-check
        run: npm run type-check

      # ── Cypress API Tests ─────────────────────────────────────────────────────
      - name: Cypress – API tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          spec: cypress/e2e/api/**/*.cy.ts
          browser: chrome

      # ── Cypress UI Tests ──────────────────────────────────────────────────────
      - name: Cypress – UI tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          spec: cypress/e2e/ui/**/*.cy.ts
          browser: chrome

      # ── Newman / Postman ──────────────────────────────────────────────────────
      - name: Newman – Postman collection
        run: npm run test:api:newman
        continue-on-error: true

      # ── Allure Report ─────────────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # ── Upload Allure as artifact ─────────────────────────────────────────────
      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── Upload Cypress videos on failure ──────────────────────────────────────
      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7

      # ── Upload Newman HTML report ─────────────────────────────────────────────
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 30

  # ── Deploy Allure to GitHub Pages ─────────────────────────────────────────────
  deploy-report:
    name: Deploy Allure → GitHub Pages
    needs: test
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
